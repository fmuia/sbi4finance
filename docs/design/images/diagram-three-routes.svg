<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 390" role="img" aria-label="Three routes from a return series to VaR and ES, with measured costs per name" font-size="13"><rect width="760" height="390" fill="#fcfcfb"/><defs><marker id="glance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a29a"></path></marker></defs><text data-claude-text-id="title" x="24" y="30" font-size="15" font-weight="600" fill="#0b0b0b">Three routes from a return series to VaR and ES</text><text data-claude-text-id="subtitle" x="24" y="50" font-size="11.5" fill="#52514e">Costs per name of 1,000 daily returns on one 2-core CPU; highlighted: the route the tutorial teaches</text><g data-claude-anchor="connectors" fill="none" stroke="#a3a29a" stroke-width="1.25"><path d="M144 212H168" marker-end="url(#glance-arrow)"></path><path d="M84 176V104H168" marker-end="url(#glance-arrow)"></path><path d="M84 248V320H168" marker-end="url(#glance-arrow)"></path><g><path d="M360 104H384" marker-end="url(#glance-arrow)"></path><path d="M552 104H576" marker-end="url(#glance-arrow)"></path></g><g><path d="M360 212H384" marker-end="url(#glance-arrow)"></path><path d="M552 212H576" marker-end="url(#glance-arrow)"></path></g><g><path d="M360 320H384" marker-end="url(#glance-arrow)"></path><path d="M552 320H576" marker-end="url(#glance-arrow)"></path></g></g><g data-claude-anchor="data"><rect x="24" y="176" width="120" height="72" rx="8" fill="none" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="data-name" x="84" y="200" text-anchor="middle" font-weight="600" fill="#0b0b0b">Daily returns</text><text data-claude-text-id="data-days" x="84" y="224" text-anchor="middle" font-size="11.5" fill="#52514e">1,000 days</text><text data-claude-text-id="data-name-line" x="84" y="240" text-anchor="middle" font-size="11.5" fill="#52514e">one name</text></g><g data-claude-anchor="lane-ml"><rect x="168" y="76" width="192" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><rect x="384" y="76" width="168" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><rect x="576" y="76" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="ml-name" x="264" y="100" text-anchor="middle" font-weight="600" fill="#0b0b0b">Approximate ML</text><text data-claude-text-id="ml-line" x="264" y="118" text-anchor="middle" font-size="11.5" fill="#52514e">grid filter, Hessian</text><text data-claude-text-id="ml-out" x="468" y="100" text-anchor="middle" font-weight="600" fill="#0b0b0b">Point estimate</text><text data-claude-text-id="ml-out-line" x="468" y="118" text-anchor="middle" font-size="11.5" fill="#52514e">Wald intervals</text><text data-claude-text-id="ml-risk" x="656" y="108" text-anchor="middle" font-weight="600" fill="#0b0b0b">Plug-in VaR, ES</text><text data-claude-text-id="ml-note" x="168" y="150" font-size="11.5" fill="#52514e">118 CPU-s per name · jump-parameter intervals cover 60–68% · 10-day ES too low (Z2 −0.10)</text></g><g data-claude-anchor="lane-pmmh"><rect x="168" y="184" width="192" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><rect x="384" y="184" width="168" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><rect x="576" y="184" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="pmmh-name" x="264" y="208" text-anchor="middle" font-weight="600" fill="#0b0b0b">Particle MCMC</text><text data-claude-text-id="pmmh-line" x="264" y="226" text-anchor="middle" font-size="11.5" fill="#52514e">particle filter, 4 chains</text><text data-claude-text-id="pmmh-out" x="468" y="208" text-anchor="middle" font-weight="600" fill="#0b0b0b">Exact posterior</text><text data-claude-text-id="pmmh-out-line" x="468" y="226" text-anchor="middle" font-size="11.5" fill="#52514e">parameters, today’s vol</text><text data-claude-text-id="pmmh-risk" x="656" y="216" text-anchor="middle" font-weight="600" fill="#0b0b0b">Predictive VaR, ES</text><text data-claude-text-id="pmmh-note" x="168" y="258" font-size="11.5" fill="#52514e">285 to 1,733 CPU-s per name for 400 effective draws · the exact reference</text></g><g data-claude-anchor="lane-amortized"><rect x="168" y="292" width="192" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><rect x="384" y="292" width="168" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><rect x="576" y="292" width="160" height="56" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text data-claude-text-id="npe-name" x="264" y="316" text-anchor="middle" font-weight="600" fill="#0b0b0b">Amortized posterior</text><text data-claude-text-id="npe-line" x="264" y="334" text-anchor="middle" font-size="11.5" fill="#52514e">network trained once</text><text data-claude-text-id="npe-out" x="468" y="316" text-anchor="middle" font-weight="600" fill="#0b0b0b">Posterior draws</text><text data-claude-text-id="npe-out-line" x="468" y="334" text-anchor="middle" font-size="11.5" fill="#52514e">parameters, today’s vol</text><text data-claude-text-id="npe-risk" x="656" y="324" text-anchor="middle" font-weight="600" fill="#0b0b0b">Predictive VaR, ES</text><text data-claude-text-id="npe-note" x="168" y="366" font-size="11.5" fill="#52514e">1.4 CPU-s per name after 64 min of training · calibrated on average · audit 18–146 CPU-s</text></g></svg>
