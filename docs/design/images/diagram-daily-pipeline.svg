<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="592" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 592" role="img" aria-label="Train once; each morning, one network pass per name, then an audit" font-size="13"><rect width="760" height="592" fill="#fcfcfb"/><defs><marker id="pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a29a"></path></marker></defs><text data-claude-text-id="title" x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">Train once; each morning, one network pass per name, then an audit</text><g data-claude-anchor="lane-training"><rect x="24" y="64" width="712" height="132" rx="8" fill="#f0efec"></rect><text data-claude-text-id="lane-training-name" x="40" y="88" font-weight="600" fill="#0b0b0b">Once, before use: 64 minutes on 2 CPU cores</text></g><g data-claude-anchor="lane-daily"><rect x="24" y="220" width="712" height="348" rx="8" fill="#f0efec"></rect><text data-claude-text-id="lane-daily-name" x="40" y="244" font-weight="600" fill="#0b0b0b">Every morning, for each name: 1.4 CPU-seconds before the audit</text></g><g data-claude-anchor="connectors" fill="none" stroke="#a3a29a" stroke-width="1.25"><path d="M252 142H272" marker-end="url(#pipe-arrow)"></path><path d="M486 142H506" marker-end="url(#pipe-arrow)"></path><path d="M614 180V258" marker-end="url(#pipe-arrow)"></path><path d="M252 298H272" marker-end="url(#pipe-arrow)"></path><path d="M486 298H506" marker-end="url(#pipe-arrow)"></path><path d="M614 336V352H146V366" marker-end="url(#pipe-arrow)"></path><path d="M252 406H272" marker-end="url(#pipe-arrow)"></path><path d="M486 406H506" marker-end="url(#pipe-arrow)"></path><path d="M146 444V474" marker-end="url(#pipe-arrow)"></path><path d="M380 476V446" marker-end="url(#pipe-arrow)"></path></g><text data-claude-text-id="edge-weights" x="622" y="212" font-size="11.5" fill="#52514e">trained weights</text><text data-claude-text-id="edge-check" x="154" y="464" font-size="11.5" fill="#52514e">proposals fitted to the draws</text><text data-claude-text-id="edge-corrected" x="388" y="464" font-size="11.5" fill="#52514e">corrected draws</text><g data-claude-anchor="box-prior"><rect x="40" y="104" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="prior-name" x="52" y="128" font-weight="600" fill="#0b0b0b">Prior p(ϑ)</text><text data-claude-text-id="prior-l1" x="52" y="148" font-size="11.5" fill="#52514e">Draws the 8 parameters</text><text data-claude-text-id="prior-l2" x="52" y="164" font-size="11.5" fill="#52514e">in risk-manager units</text></g><g data-claude-anchor="box-simulator"><rect x="274" y="104" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="sim-name" x="286" y="128" font-weight="600" fill="#0b0b0b">Simulator</text><text data-claude-text-id="sim-l1" x="286" y="148" font-size="11.5" fill="#52514e">1,000 days of returns</text><text data-claude-text-id="sim-l2" x="286" y="164" font-size="11.5" fill="#52514e">for each parameter draw</text></g><g data-claude-anchor="box-training"><rect x="508" y="104" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="train-name" x="520" y="128" font-weight="600" fill="#0b0b0b">Joint training</text><text data-claude-text-id="train-l1" x="520" y="148" font-size="11.5" fill="#52514e">Fits both networks on</text><text data-claude-text-id="train-l2" x="520" y="164" font-size="11.5" fill="#52514e">2.56 million series</text></g><g data-claude-anchor="box-input"><rect x="40" y="260" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="input-name" x="52" y="284" font-weight="600" fill="#0b0b0b">Input</text><text data-claude-text-id="input-l1" x="52" y="304" font-size="11.5" fill="#52514e">Last 1,000 daily returns</text><text data-claude-text-id="input-l2" x="52" y="320" font-size="11.5" fill="#52514e">return and log(y² + 0.01)</text></g><g data-claude-anchor="box-summary"><rect x="274" y="260" width="212" height="76" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text data-claude-text-id="summary-name" x="286" y="284" font-weight="600" fill="#0b0b0b">Summary network</text><text data-claude-text-id="summary-l1" x="286" y="304" font-size="11.5" fill="#0b0b0b">Reads 1,000 × 2 numbers</text><text data-claude-text-id="summary-l2" x="286" y="320" font-size="11.5" fill="#0b0b0b">returns 32 statistics</text></g><g data-claude-anchor="box-inference"><rect x="508" y="260" width="212" height="76" rx="8" fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="2"></rect><text data-claude-text-id="inference-name" x="520" y="284" font-weight="600" fill="#0b0b0b">Inference network</text><text data-claude-text-id="inference-l1" x="520" y="304" font-size="11.5" fill="#0b0b0b">Moves noise in 50 steps</text><text data-claude-text-id="inference-l2" x="520" y="320" font-size="11.5" fill="#0b0b0b">into 1,000 posterior draws</text></g><g data-claude-anchor="box-draws"><rect x="40" y="368" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="draws-name" x="52" y="392" font-weight="600" fill="#0b0b0b">Posterior draws</text><text data-claude-text-id="draws-l1" x="52" y="412" font-size="11.5" fill="#52514e">8 parameters and</text><text data-claude-text-id="draws-l2" x="52" y="428" font-size="11.5" fill="#52514e">today's spot volatility</text></g><g data-claude-anchor="box-forecast"><rect x="274" y="368" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="forecast-name" x="286" y="392" font-weight="600" fill="#0b0b0b">Forecast</text><text data-claude-text-id="forecast-l1" x="286" y="412" font-size="11.5" fill="#52514e">20 paths of 10 days</text><text data-claude-text-id="forecast-l2" x="286" y="428" font-size="11.5" fill="#52514e">from each draw</text></g><g data-claude-anchor="box-risk"><rect x="508" y="368" width="212" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="risk-name" x="520" y="392" font-weight="600" fill="#0b0b0b">Risk numbers</text><text data-claude-text-id="risk-l1" x="520" y="412" font-size="11.5" fill="#52514e">99% VaR and 97.5% ES</text><text data-claude-text-id="risk-l2" x="520" y="428" font-size="11.5" fill="#52514e">with the range of the VaR</text></g><g data-claude-anchor="box-audit"><rect x="40" y="476" width="446" height="76" rx="8" fill="none" fill-opacity="1" stroke="#a3a29a" stroke-width="1.25"></rect><text data-claude-text-id="audit-name" x="52" y="500" font-weight="600" fill="#0b0b0b">Audit with the particle filter</text><text data-claude-text-id="audit-l1" x="52" y="520" font-size="11.5" fill="#52514e">Reweights proposals by the filter's likelihood estimate</text><text data-claude-text-id="audit-l2" x="52" y="536" font-size="11.5" fill="#52514e">18 to 146 CPU-s; a low score sends the name to particle MCMC</text></g></svg>
