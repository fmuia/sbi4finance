[project]
name = "sbi4finance"
version = "0.1.0"
description = "The lab of the sbi4finance tutorial: simulators, calibration banks, training, references and studies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["sbi4f-tutorial==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbi4finance"]

# ---------------------------------------------------------------------------
# pixi: run every command from lab/. `pixi install --locked` creates the lab
# environment, `pixi shell` enters it. bayesflow is PyPI-only, so it and its
# backend come from pypi-dependencies; everything else comes from conda-forge.
# The tutorial has its own environment in tutorial/pyproject.toml.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
sbi4finance = { path = ".", editable = true }
sbi4f-tutorial = { path = "../tutorial", editable = true }
# Exact pins: the shipped checkpoints were trained with these versions.
bayesflow = "==2.0.14"
keras = "==3.15.1"
jax = "==0.11.1"
numba = "==0.68.0"
scipy = "==1.18.1" # Fourier quadrature, Gaussian references and option expectations

[tool.pixi.activation.env]
KERAS_BACKEND = "jax"

[tool.pixi.tasks]
test = "python -m unittest discover -s tests -v"
bank = "python scripts/calibration_bank.py"
surface = "python scripts/build_surface.py"
accept = "python studies/accept.py"
manifest = "python studies/manifest.py"
claims = "python studies/claims.py"
runtime-check = "python studies/runtime_boundary.py"
copy-to-tutorial = "python studies/copy_to_tutorial.py"
release-check = "python studies/manifest.py --check && python studies/claims.py --check && python studies/runtime_boundary.py"
course-check = "python ../course/scripts/check_v2_plan.py"
discover-cluster = "python cluster/discover_cluster.py"

# GPU environment for Oscar (linux-64 only): `pixi install -e gpu` on a login node.
[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.pypi-dependencies]
jax-cuda12-plugin = { version = "==0.11.1", extras = ["with-cuda"] }


# Current numerical backbone; archived legacy studies retain the default BF2.0 environment.
[tool.pixi.feature.core.dependencies]
python = "3.12.*"
marimo = "==0.25.1"

[tool.pixi.feature.core.pypi-dependencies]
sbi4finance = { path = ".", editable = true }
sbi4f-tutorial = { path = "../tutorial", editable = true }
plotly = "==6.5.0" # point selection in the SPX recovery panels
bayesflow = "==2.1.0"
keras = "==3.15.1"
jax = "==0.11.1"
numba = "==0.68.0"
scipy = "==1.18.1"
numpy = "==2.5.3"

[tool.pixi.feature.core.activation.env]
KERAS_BACKEND = "jax"

[tool.pixi.feature.core.tasks]
core-check = "python scripts/check_full_surface_environment.py"
test = "python -m unittest discover -s tests -v"
accept = "python studies/accept.py"
runtime-check = "python studies/runtime_boundary.py"
copy-to-tutorial = "python studies/copy_to_tutorial.py"
manifest = "python studies/manifest.py"
claims = "python studies/claims.py"
release-check = "python studies/manifest.py --check && python studies/claims.py --check && python studies/runtime_boundary.py"
course-check = "python ../course/scripts/check_v2_plan.py"

# Reference MCMC is optional and isolated from participant/training installs.
[tool.pixi.feature.reference.pypi-dependencies]
pymc = "==6.3.2"

[tool.pixi.environments]
gpu = ["cuda"]
core = { features = ["core"], no-default-feature = true }
core-gpu = { features = ["core", "cuda"], no-default-feature = true }
core-reference = { features = ["core", "reference"], no-default-feature = true }
