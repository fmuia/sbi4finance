   <g id="text_1">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Inter'; text-anchor: start; fill: #15153b" x="28.8" y="34.396875" transform="rotate(-0 28.8 34.396875)">Trajectory inference: one history, many posterior snapshots</text>
   </g>
   <g id="text_2">
