   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Inter'; fill: #2e7d43" transform="translate(731.389687 153.212578)">GRU summary</text>
    <text style="font-size: 12px; font-family: 'Inter'; fill: #2e7d43" transform="translate(711.525 174.796172)">ordered observations</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'Inter'; fill: #2e7d43" transform="translate(897.512227 145.026738)">Conditional flow</text>
    <!-- $q_\phi(\mathbf{\Theta}\mid r_{1:T},T)$ -->
    <g style="fill: #2e7d43" transform="translate(903.5075 162.96)">
     <text>
      <tspan x="0" y="-0.140625" style="font-style: oblique; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">q</tspan>
      <tspan x="37.418237" y="-0.140625" style="font-style: oblique; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">r</tspan>
      <tspan x="64.244458" y="-0.140625" style="font-style: oblique; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">T</tspan>
      <tspan x="7.299805" y="1.584369" style="font-style: oblique; font-size: 8.05px; font-family: 'DejaVu Sans'; fill: #2e7d43">ϕ</tspan>
      <tspan x="53.116748" y="1.584369" style="font-style: oblique; font-size: 8.05px; font-family: 'DejaVu Sans'; fill: #2e7d43">T</tspan>
      <tspan x="12.924585" y="-0.140625" style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">(</tspan>
      <tspan x="29.427759" y="-0.140625" style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">∣</tspan>
      <tspan x="58.348462" y="-0.140625" style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">,</tspan>
      <tspan x="71.269116" y="-0.140625" style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">)</tspan>
      <tspan x="17.411157" y="-0.140625" style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #2e7d43">Θ</tspan>
      <tspan x="42.146265" y="1.584369" style="font-size: 8.05px; font-family: 'DejaVu Sans'; fill: #2e7d43">1</tspan>
      <tspan x="48.836255" y="1.584369" style="font-size: 8.05px; font-family: 'DejaVu Sans'; fill: #2e7d43">:</tspan>
     </text>
    </g>
    <text style="font-size: 11.5px; font-family: 'Inter'; fill: #2e7d43" transform="translate(895.196953 182.690137)">parameter draws</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'Inter'; text-anchor: middle; fill: #4e2a84" x="264.6" y="249.319844" transform="rotate(-0 264.6 249.319844)">Process randomness generates the returns; no extra quote noise is added.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'Inter'; text-anchor: middle; fill: #2e7d43" x="772.2" y="249.319844" transform="rotate(-0 772.2 249.319844)">The mask excludes unrevealed days and padding.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'Inter'; fill: #4e2a84" transform="translate(113.005312 302.711953)">Offline: random prefixes and known parameter targets</text>
    <text style="font-size: 12px; font-family: 'Inter'; fill: #4e2a84" transform="translate(149.80125 323.086172)">train the GRU and conditional flow jointly.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'Inter'; fill: #2e7d43" transform="translate(603.707813 302.758828)">New history: use the fixed estimator at any revealed prefix.</text>
    <text style="font-size: 12px; font-family: 'Inter'; fill: #2e7d43" transform="translate(614.41875 322.977422)">Generating parameters and latent states are not inputs.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.7px; font-family: 'Inter'; text-anchor: start; fill: #15153b" x="28.8" y="378.313734" transform="rotate(-0 28.8 378.313734)">Each snapshot uses the original prior and the entire revealed history. Do not multiply posteriors from overlapping prefixes.</text>
