<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Daily SVJ · An inference workflow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #161616;
        background: #fcfcfb;
        font-size: 16px;
        line-height: 1.6;
        --accent: #215ea8;
        --muted: #62615c;
        --line: #e1e0d9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      a { color: var(--accent); text-underline-offset: 0.2em; }
      a:focus-visible, summary:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }
      .svj-skip-link {
        position: absolute;
        top: -5rem;
        left: 1rem;
        z-index: 2;
        padding: 0.6rem 1rem;
        background: white;
      }
      .svj-skip-link:focus { top: 1rem; }
      #app-shell { max-width: 1160px; margin: 0 auto; padding: 2rem 2.5rem 4rem; }
      .svj-masthead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 1.2rem;
        border-bottom: 1px solid var(--line);
      }
      .svj-brand { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.025em; }
      .svj-edition { color: var(--muted); font-size: 0.85rem; }
      .svj-lesson-layout {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 3rem;
        align-items: start;
      }
      .svj-contents { position: sticky; top: 1.5rem; padding-top: 2.5rem; }
      .svj-contents-title {
        margin: 0 0 0.8rem;
        color: var(--muted);
        font-size: 0.73rem;
        font-weight: 650;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .svj-contents ol { list-style: none; margin: 0; padding: 0; }
      .svj-contents li { margin-bottom: 0.35rem; }
      .svj-contents a {
        display: grid;
        grid-template-columns: 1.5rem 1fr;
        gap: 0.45rem;
        padding: 0.4rem 0;
        color: #363631;
        font-size: 0.88rem;
        text-decoration: none;
      }
      .svj-contents a:hover { color: var(--accent); text-decoration: underline; }
      .svj-contents .svj-step { color: var(--accent); font-variant-numeric: tabular-nums; }
      .svj-exercise-link { margin-top: 1.25rem; border-top: 1px solid var(--line); padding-top: 0.8rem; }
      .svj-exercise-link a { display: block; }
      .svj-lesson { min-width: 0; }
      .svj-introduction { padding: 2.2rem 0 1.7rem; }
      .svj-stage {
        padding: 2rem 0;
        border-top: 1px solid var(--line);
        scroll-margin-top: 1.5rem;
      }
      .svj-output { margin: 1.5rem 0 0; min-width: 0; }
      .svj-control {
        margin: 1.4rem 0;
        padding: 1rem 1.1rem;
        background: #f0f5fb;
        border-left: 3px solid var(--accent);
      }
      marimo-cell {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        --marimo-cell-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --marimo-cell-heading-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --marimo-cell-foreground: #161616;
        --marimo-cell-accent: #215ea8;
        --marimo-cell-font-size: 1rem;
      }
      .svj-footer {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 820px) {
        #app-shell { padding: 1.25rem 1.25rem 3rem; }
        .svj-lesson-layout { display: block; }
        .svj-contents { position: static; padding-top: 1.5rem; }
        .svj-contents ol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.15rem 1rem; }
        .svj-exercise-link { margin-top: 0.6rem; padding-top: 0.5rem; }
        .svj-introduction { padding-top: 1.5rem; }
      }
      @media (max-width: 420px) {
        .svj-masthead { display: block; }
        .svj-edition { margin-top: 0.2rem; }
        .svj-contents a { font-size: 0.82rem; }
        .svj-stage { padding: 1.6rem 0; }
      }
      @media print {
        #app-shell { max-width: none; padding: 0; }
        .svj-contents, .svj-skip-link, .svj-footer { display: none; }
        .svj-lesson-layout { display: block; }
        .svj-stage { break-inside: auto; }
        .svj-output { break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <a class="svj-skip-link" href="#lesson">Skip to lesson</a>
    <main id="app-shell">
      <header class="svj-masthead">
        <span class="svj-brand">sbi4finance</span>
        <span class="svj-edition">Inference workflows · Daily SVJ</span>
      </header>
      <div class="svj-lesson-layout">
        <nav class="svj-contents" aria-label="Lesson stages">
          <p class="svj-contents-title">Follow the workflow</p>
          <ol>
            <li><a href="#specify"><span class="svj-step">01</span> Specify the task</a></li>
            <li><a href="#prior"><span class="svj-step">02</span> Check the prior</a></li>
            <li><a href="#train"><span class="svj-step">03</span> Train and select</a></li>
            <li><a href="#diagnose"><span class="svj-step">04</span> Diagnose and respond</a></li>
            <li><a href="#propagate"><span class="svj-step">05</span> Propagate uncertainty</a></li>
            <li><a href="#evaluate"><span class="svj-step">06</span> Evaluate inference</a></li>
          </ol>
          <div class="svj-exercise-link"><a href="#exercise">Try the training exercise</a></div>
        </nav>
        <article id="lesson" class="svj-lesson" aria-label="Daily SVJ inference lesson">
          <header class="svj-introduction">
            <marimo-cell name="workflow-introduction"></marimo-cell>
          </header>
          <section id="specify" class="svj-stage" aria-label="Specify observations and the model">
            <marimo-cell name="model-specification"></marimo-cell>
            <div class="svj-output"><marimo-cell name="prior-table"></marimo-cell></div>
            <div class="svj-output"><marimo-cell name="observed-history"></marimo-cell></div>
          </section>
          <section id="prior" class="svj-stage" aria-label="Check prior predictive implications">
            <marimo-cell name="prior-predictive-explanation"></marimo-cell>
            <div class="svj-output"><marimo-cell name="prior-predictive-checks"></marimo-cell></div>
          </section>
          <section id="train" class="svj-stage" aria-label="Train and select an inference artifact">
            <marimo-cell name="training-artifact"></marimo-cell>
          </section>
          <section id="diagnose" class="svj-stage" aria-label="Condition, diagnose and choose a response">
            <div class="svj-control"><marimo-cell name="live-control"></marimo-cell></div>
            <marimo-cell name="inference-decision"></marimo-cell>
            <div class="svj-output"><marimo-cell name="diagnostics"></marimo-cell></div>
            <div class="svj-output"><marimo-cell name="posterior-summary"></marimo-cell></div>
          </section>
          <section id="propagate" class="svj-stage" aria-label="Propagate joint uncertainty to risk">
            <marimo-cell name="risk-explanation"></marimo-cell>
            <div class="svj-output"><marimo-cell name="risk-summary"></marimo-cell></div>
            <div class="svj-output"><marimo-cell name="risk-uncertainty"></marimo-cell></div>
          </section>
          <section id="evaluate" class="svj-stage" aria-label="Evaluate inference beyond the illustration">
            <marimo-cell name="evaluation"></marimo-cell>
          </section>
          <section id="exercise" class="svj-stage" aria-label="Saved-bank training exercise">
            <marimo-cell name="training-exercise"></marimo-cell>
          </section>
          <footer class="svj-footer"><a href="#lesson">Back to the start</a></footer>
        </article>
      </div>
    </main>
  </body>
</html>
