[project]
name = "sbi4finance"
version = "0.1.0"
description = "Amortized Bayesian inference for finance: tutorial material built on BayesFlow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbi4finance"]

# ---------------------------------------------------------------------------
# pixi: `pixi install` creates the tutorial environment, `pixi shell` enters it.
# bayesflow is PyPI-only, so it and its backend come from pypi-dependencies;
# everything else comes from conda-forge.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
marimo = ">=0.25.1"
jq = "*"          # marimo-pair skill scripts need jq on PATH

[tool.pixi.pypi-dependencies]
sbi4finance = { path = ".", editable = true }
# Exact pins: the shipped checkpoint was trained with these versions.
bayesflow = "==2.0.14"
keras = "==3.15.1"
jax = "==0.11.1"
numba = "==0.68.0"
scipy = "==1.18.1" # Fourier quadrature, Gaussian references and option expectations

[tool.pixi.activation.env]
KERAS_BACKEND = "jax"

[tool.pixi.tasks]
edit = { cmd = "marimo edit --no-token", cwd = "notebooks" }
check = "marimo check notebooks"
selfcheck = "python src/sbi4finance/mmar/univariate.py"
gbm-demo = "python scripts/gbm_reference.py"
test-gbm = "python -m unittest discover -s tests -p test_gbm.py -v"
gbm-bank = "python scripts/generate_gbm_bank.py"
gbm-train = "python scripts/train_gbm.py"
test-simulators = "python -m unittest discover -s tests -v"
test-heston = "python -m unittest discover -s tests -p test_heston.py -v"
heston-validate = "python scripts/validate_heston.py --include-svj"
heston-benchmark = "python scripts/benchmark_heston.py"
heston-bank = "python scripts/generate_heston_bank.py"
heston-reference = "python scripts/check_heston_reference.py"
heston-task-numerics = "python scripts/check_heston_discretization.py"
heston-train = "python scripts/train_heston.py"
review-foundations = "marimo edit notebooks/01_gbm_foundations.py --no-token"
review-kernels = "marimo edit notebooks/04_heston_svj_kernels.py --no-token"
review-heston = "marimo edit notebooks/05_heston_joint_inference.py --no-token"
option-bank = "python scripts/generate_option_bank.py"
hkde-validate = "python scripts/validate_hkde.py"
hkde-reference = "python scripts/check_hkde_reference.py"
hkde-train = "python scripts/train_hkde.py"
hkde-evaluate = "python scripts/evaluate_hkde.py"
hkde-correct = "python scripts/evaluate_hkde_correction.py"
review-hkde = "marimo edit notebooks/06_hkde_and_pricing.py --no-token"
hkde-surrogate = "python scripts/run_hkde_surrogate.py"
review-hkde-surrogate = "marimo edit notebooks/07_hkde_price_surrogate.py --no-token"
review-hkde-corrected = "marimo edit notebooks/10_hkde_corrected_workflow.py --no-token"
demo-hkde-corrected = { cmd = "marimo edit notebooks/10_hkde_corrected_workflow.py --no-token", env = { SBI4FINANCE_HKDE_DEMO = "1" } }
hkde-calibration-audit = "python scripts/audit_hkde_calibration_gate.py"
review-hkde-calibration = "marimo edit notebooks/11_hkde_calibration_audit.py --no-token"
bergomi-validate = "python scripts/validate_bergomi.py"
rough-bergomi-validate = "python scripts/validate_rough_bergomi.py"
bergomi-refinement = "python scripts/check_bergomi_coupled_refinement.py"
review-bergomi = "marimo edit notebooks/08_bergomi_models.py --no-token"
data-check = "python -m unittest discover -s tests"
hkde-data-check = "python scripts/check_hkde_data.py"
hkde-bank-data-check = "python scripts/check_hkde_bank_data.py"
hkde-data-walkthrough = "marimo edit notebooks/hkde_data_walkthrough.py --no-token"
hkde-teaching-check = "python scripts/check_hkde_teaching.py"
hkde-teaching-integration-check = "python scripts/check_hkde_teaching_integration.py"
option-bank-shard = "python scripts/generate_option_bank_shard.py"
option-bank-assemble = "python scripts/assemble_option_bank.py"
rough-reference = "python scripts/check_rough_reference.py"
rough-train = "python scripts/train_rough.py"
rough-evaluate = "python scripts/evaluate_rough.py"
rough-heldout-test = "python scripts/evaluate_rough_test.py"
review-rough-inference = "marimo edit notebooks/09_rough_inference.py --no-token"
svj-selfcheck = "python src/sbi4finance/svj/model.py"
test-svj = "python -m unittest discover -s tests -p 'test_svj*.py' -v"
test-beta-shrinkage = "python -m unittest discover -s tests -p test_beta_shrinkage.py -v"
beta-study = "python scripts/beta_study.py"
beta-window-betas = "python scripts/beta_window_betas.py"
svj-train = "python scripts/svj_train.py"
svj-validate = "python scripts/svj_validate.py"
svj-agreement = "python scripts/svj_agreement.py"
svj-backtest = "python scripts/svj_backtest.py"
svj-backtest-check = "python scripts/svj_backtest_check.py"
svj-rolling = "python scripts/svj_rolling.py"
svj-classical = "python scripts/svj_classical.py"
svj-costs = "python scripts/svj_costs.py"
svj-daily = "python scripts/svj_daily.py"
svj-bank = "python scripts/generate_svj_bank.py"
svj-bank-check = "python scripts/check_svj_bank.py"
svj-teaching = "python scripts/prepare_svj_teaching.py"
review-svj = "marimo edit notebooks/svj_var_pipeline.py --no-token"
demo-svj = { cmd = "marimo edit notebooks/svj_var_pipeline.py --no-token", env = { SBI4FINANCE_SVJ_DEMO = "1" } }
test-workflow = "python -m unittest discover -s tests -p 'test_*workflow.py' -v"

# GPU environment for Oscar (linux-64 only): `pixi install -e gpu` on a login node.
[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.pypi-dependencies]
jax-cuda12-plugin = { version = "==0.11.1", extras = ["with-cuda"] }

# Optional live notebook collaboration; keeps Studio and MCP out of the
# default tutorial and cluster environments. Inherits the scientific stack.
[tool.pixi.feature.collaboration.dependencies]
marimo = "==0.25.1"

[tool.pixi.feature.collaboration.pypi-dependencies]
marimo-studio = "==0.3.0"
marimo-lens = "==0.2.3"
mcp = "==2.3.0"
httpx2 = "==2.13.1"
# Match the existing scientific lock when resolving this optional environment.
numpy = "==2.5.3"

[tool.pixi.feature.collaboration.tasks]
collaborate = { cmd = "marimo edit --host 127.0.0.1 --port 8772 --no-token --mcp code-mode --no-sandbox", env = { MARIMO_STUDIO_EDIT_ROOT = "marimo" } }
studio-svj = "marimo edit notebooks/svj_var_pipeline.py --host 127.0.0.1 --port 8772 --no-token --mcp code-mode --no-sandbox"
studio-build = "marimo-studio view build lesson --target notebooks/svj_var_pipeline.py --profile production"
studio-check = "python scripts/check_marimo_studio.py"
mcp-check = "python scripts/check_marimo_mcp.py"

[tool.pixi.environments]
gpu = ["cuda"]
collaboration = ["collaboration"]

[tool.marimo-studio]
notebook = "notebooks/svj_var_pipeline.py"
view_root = "notebooks/views/svj"
default = "lesson"
runtime = "server"

